<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>EcoVision 2.0 — Redirecting…</title>
  <meta http-equiv="refresh" content="0; url=/dashboard"/>
  <meta name="description" content="EcoVision 2.0 Smart Waste Intelligence Platform"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');

    body {
      background: #050a05;
      color: #e2ffe2;
      font-family: 'Inter', 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* Animated background grid */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,255,136,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,255,136,0.04) 1px, transparent 1px);
      background-size: 40px 40px;
      animation: gridPan 20s linear infinite;
      pointer-events: none;
    }

    @keyframes gridPan {
      0%   { background-position: 0 0; }
      100% { background-position: 40px 40px; }
    }

    /* Glow orb */
    body::after {
      content: '';
      position: fixed;
      width: 600px; height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0,255,136,0.08) 0%, transparent 70%);
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      animation: pulse 3s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.6; transform: translate(-50%, -50%) scale(1); }
      50%       { opacity: 1;   transform: translate(-50%, -50%) scale(1.1); }
    }

    .splash {
      text-align: center;
      position: relative;
      z-index: 10;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .logo-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-bottom: 28px;
    }

    .logo-icon {
      font-size: 52px;
      animation: spin 6s linear infinite;
      display: inline-block;
    }

    @keyframes spin {
      0%   { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .logo-text {
      font-size: 42px;
      font-weight: 900;
      letter-spacing: -1px;
      background: linear-gradient(135deg, #00ff88, #00d4ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .logo-version {
      font-size: 13px;
      background: rgba(0,255,136,0.12);
      border: 1px solid rgba(0,255,136,0.25);
      color: #00ff88;
      padding: 3px 9px;
      border-radius: 99px;
      font-weight: 700;
      letter-spacing: 1px;
      -webkit-text-fill-color: #00ff88;
    }

    .tagline {
      font-size: 18px;
      color: #7aaa7a;
      margin-bottom: 40px;
      letter-spacing: 0.5px;
    }

    .progress-bar {
      width: 260px;
      height: 3px;
      background: rgba(0,255,136,0.1);
      border-radius: 99px;
      margin: 0 auto 24px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #00ff88, #00d4ff);
      border-radius: 99px;
      animation: load 0.8s ease-out forwards;
    }

    @keyframes load {
      from { width: 0; }
      to   { width: 100%; }
    }

    .redirect-msg {
      font-size: 13px;
      color: rgba(122,170,122,0.7);
      font-family: 'Courier New', monospace;
    }

    .go-btn {
      display: inline-block;
      margin-top: 28px;
      padding: 14px 36px;
      background: linear-gradient(135deg, rgba(0,255,136,0.15), rgba(0,212,255,0.1));
      border: 1px solid rgba(0,255,136,0.35);
      color: #00ff88;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
      letter-spacing: 0.5px;
      transition: all 0.2s;
    }

    .go-btn:hover {
      background: linear-gradient(135deg, rgba(0,255,136,0.25), rgba(0,212,255,0.18));
      box-shadow: 0 0 24px rgba(0,255,136,0.2);
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <div class="splash">
    <div class="logo-wrap">
      <span class="logo-icon">♻️</span>
      <div>
        <div class="logo-text">ECOVISION <span class="logo-version">v2.0</span></div>
      </div>
    </div>
    <div class="tagline">Smart Waste Intelligence · AI-Powered Classification</div>
    <div class="progress-bar"><div class="progress-fill"></div></div>
    <div class="redirect-msg">Redirecting to Command Center…</div>
    <a href="/dashboard" class="go-btn">Go to Dashboard →</a>
  </div>

  <script>
    // Immediately redirect — meta refresh is backup
    window.location.replace('/dashboard');
  </script>
</body>
</html>
